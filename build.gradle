plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // This is the new plugin for NeoForge 1.21.1
    id 'net.neoforged.moddev' version '2.0.73'
}

version = '1.0'
group = 'com.moskowitz.realisticcruelty' // Update to your package name
base {
    archivesName = 'realisticcruelty'
}

// Minecraft 1.21.1 REQUIRES Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // These versions come from your gradle.properties (the one I gave you earlier)
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This replaces the old 'runs' block
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'realisticcruelty'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'realisticcruelty'
        }

        data {
            data()
            programArguments.addAll '--mod', 'realisticcruelty', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        realisticcruelty {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // In 1.21.1, the 'minecraft' dependency is handled by the neoForge block above
    // You only put extra mods (like JEI or Pehkui) here
}

// Manifest remains similar, but usually goes in neoforge.mods.toml now
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title": "realisticcruelty",
            "Specification-Vendor": "Steve Moskowitz",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "Steve Moskowitz",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
