# Mandatory: The loader for NeoForge 1.21.1 is javafml
modLoader="javafml"
# Mandatory: For NeoForge 1.21.1, this is version 1
loaderVersion="[1,)"
# Mandatory: Your license
license="All rights reserved"

[[mods]]
    # Mandatory: Your Mod ID (no spaces!)
    modId="realistic_cruelty"
    # Substitutes version from build.gradle
    version="${file.jarVersion}"
    # Mandatory: The name people see in the mod list
    displayName="Realistic Cruelty"
    # Optional: Your logo file in src/main/resources/
    logoFile="icon.png"
    # Credits to the original authors
    credits="BlueRain"
    authors="Steve Moskowitz, ImmortalDamned"
    
    description='''
Adds realistic and visceral blood, gore, and medical effects to Minecraft. 
Ported to 1.21.1 for high-fidelity combat realism.
'''

[[dependencies.realistic_cruelty]]
    # This points to the NEW modloader
    modId="neoforge"
    type="required"
    # Mandatory: 21.1 is the base version for 1.21.1
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.realistic_cruelty]]
    modId="minecraft"
    type="required"
    # Version range for 1.21.1
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"
